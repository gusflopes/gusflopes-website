name: build

# Valida o build (schema das coleções, páginas, telas) fora do pod, em branch que não é o main e em PR.
# Não publica nem usa segredo: o deploy de produção é o deploy.yml (push no main).
on:
  push:
    branches-ignore: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm build

      - uses: actions/upload-artifact@v4
        with:
          name: verif
          path: |
            dist/_redirects
            dist/sitemap-0.xml
            dist/radar/index.html
            dist/noticias/**/*.html
            dist/analise/**/*.html
            dist/index.html
